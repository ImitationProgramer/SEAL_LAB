<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Main News - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        .form-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .form-container h1 {
            color: #003366;
            margin-bottom: 30px;
            font-size: 24px;
            border-left: 5px solid #003366;
            padding-left: 15px;
        }

        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #444;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            border-color: #003366;
            outline: none;
        }

        /* 2. 에디터 높이 및 스타일 설정 */
        #editor {
            height: 400px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            font-size: 16px;
        }

        .ql-toolbar {
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            background-color: #f8f9fa;
        }

        .btn-area {
            text-align: right;
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .cancel-btn {
            background-color: #f4f4f4;
            color: #666;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .submit-btn {
            background-color: #003366;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }

        .submit-btn:hover { background-color: #002244; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='home')}"></header>

<main class="container">
    <div class="form-container">
        <h1>Create Main News</h1>

        <form id="newsForm" th:action="@{/admin/news/add}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="뉴스의 제목을 입력하세요" required>
            </div>

            <div class="form-group">
                <label>Content</label>
                <div id="editor"></div>
                <input type="hidden" name="content" id="hiddenContent">
            </div>

            <div class="btn-area">
                <button type="button" class="cancel-btn" onclick="history.back()">Cancel</button>
                <button type="submit" class="submit-btn">Publish News</button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    // 툴바 옵션 설정 (글자 크기, 색상, 정렬 등)
    var toolbarOptions = [
        [{ 'header': [1, 2, 3, false] }],
        [{ 'size': ['small', false, 'large', 'huge'] }],  // 글자 크기 조절
        ['bold', 'italic', 'underline', 'strike'],        // 서식
        [{ 'color': [] }, { 'background': [] }],          // 글자색/배경색
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        [{ 'align': [] }],                                // 정렬
        ['link', 'image'],                                // 링크/이미지
        ['clean']                                         // 서식 지우기
    ];

    // 에디터 초기화
    var quill = new Quill('#editor', {
        modules: {
            toolbar: toolbarOptions
        },
        theme: 'snow',
        placeholder: '연구실 소식을 상세히 입력하세요...'
    });

    // 폼 제출(Submit) 시 실행될 로직
    var form = document.getElementById('newsForm');
    form.onsubmit = function() {
        // 1. 에디터 안에 작성된 내용을 HTML 형식으로 가져옵니다.
        var contentHtml = quill.root.innerHTML;

        // 2. 숨겨진 input(id="hiddenContent")에 값을 넣습니다.
        var hiddenInput = document.getElementById('hiddenContent');
        hiddenInput.value = contentHtml;

        // 3. 내용이 비어있는지 체크 (공백 제외)
        if(quill.getText().trim().length === 0) {
            alert("내용을 입력해주세요.");
            return false;
        }

        return true;
    };
</script>
</body>
</html>
