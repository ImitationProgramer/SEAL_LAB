<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add Main News - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        .form-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .form-container h1 {
            color: #003366;
            margin-bottom: 30px;
            font-size: 24px;
            border-left: 5px solid #003366;
            padding-left: 15px;
        }

        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #444;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            border-color: #003366;
            outline: none;
        }

        #editor {
            height: 400px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            font-size: 16px;
        }

        .ql-toolbar {
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            background-color: #f8f9fa;
        }

        .btn-area {
            text-align: right;
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .cancel-btn {
            background-color: #f4f4f4;
            color: #666;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .submit-btn {
            background-color: #003366;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }

        .submit-btn:hover { background-color: #002244; }

        /* 제로트러스트 접근 제한 안내 스타일 */
        .denied-container { text-align: center; padding: 100px 20px; }
        .denied-icon { font-size: 5rem; color: #ff4d4d; margin-bottom: 20px; }
        .denied-title { font-size: 2rem; font-weight: 800; color: #333; margin-bottom: 10px; }
        .denied-msg { color: #666; margin-bottom: 30px; line-height: 1.6; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='home')}"></header>

<main class="container">

    <div sec:authorize="hasRole('ADMIN')" class="form-container">
        <h1>Create Main News</h1>

        <form id="newsForm" th:action="@{/admin/news/add}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="뉴스의 제목을 입력하세요" required>
            </div>

            <div class="form-group">
                <label>Content</label>
                <div id="editor"></div>
                <input type="hidden" name="content" id="hiddenContent">
            </div>

            <div class="btn-area">
                <button type="button" class="cancel-btn" onclick="history.back()">Cancel</button>
                <button type="submit" class="submit-btn">Publish News</button>
            </div>
        </form>
    </div>

    <div sec:authorize="!hasRole('ADMIN')" class="denied-container">
        <div class="denied-icon">🚫</div>
        <h2 class="denied-title">Access Denied</h2>
        <p class="denied-msg">
            공지사항을 등록할 수 있는 권한이 없습니다. <br>
            메인 페이지로 돌아가 최신 소식을 확인해 주세요.
        </p>
        <a th:href="@{/}" class="auth-link">Back to Home</a>
    </div>

</main>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script th:inline="javascript">
    /* <![CDATA[ */
    // 관리자일 때만 에디터 초기화 스크립트 실행
    const editorElement = document.getElementById('editor');
    if (editorElement) {
        var toolbarOptions = [
            [{ 'header': [1, 2, 3, false] }],
            [{ 'size': ['small', false, 'large', 'huge'] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'align': [] }],
            ['link', 'image'],
            ['clean']
        ];

        var quill = new Quill('#editor', {
            modules: { toolbar: toolbarOptions },
            theme: 'snow',
            placeholder: '연구실 소식을 상세히 입력하세요...'
        });

        var form = document.getElementById('newsForm');
        form.onsubmit = function() {
            var contentHtml = quill.root.innerHTML;
            var hiddenInput = document.getElementById('hiddenContent');
            hiddenInput.value = contentHtml;

            if(quill.getText().trim().length === 0) {
                alert("내용을 입력해주세요.");
                return false;
            }
            return true;
        };
    }
    /* ]]> */
</script>
</body>
</html>
