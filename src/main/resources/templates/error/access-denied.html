<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Security Alert - SEAL LAB</title>
    <style>
        body { background-color: #f4f7f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 500px; border-top: 5px solid #d9534f; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .score-box { background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .score-value { font-size: 32px; font-weight: bold; color: #c53030; }
        p { color: #666; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 25px; padding: 12px 24px; background: #003366; color: white; text-decoration: none; border-radius: 6px; transition: 0.3s; }
        .btn:hover { background: #002244; }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">🛡️</div>
    <h1>Zero Trust Blocked</h1>
    <p>죄송합니다. 현재 <strong th:text="${userName}">사용자</strong>님의 접속 환경은<br>
        보안 요구 수준을 충족하지 못했습니다.</p>

    <div class="score-box">
        <p style="margin:0; font-size: 14px;">현재 분석된 신뢰 점수</p>
        <div class="score-value" th:text="${trustScore} + '점'">75점</div>
    </div>

    <p style="font-size: 13px; color: #999;">
        * 외부 네트워크 접속, 미인증 기기 사용, 또는<br>비정상적인 이동 경로 감지 시 차단될 수 있습니다.
    </p>

    <a href="/" class="btn">메인으로 돌아가기</a>
</div>
</body>
</html>
