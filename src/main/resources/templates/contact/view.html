<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Contact - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .contact-info-list { list-style: none; padding: 0; margin-bottom: 30px; }
        .contact-info-list li { margin-bottom: 12px; font-size: 1.05rem; color: #444; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
        .contact-info-list strong { color: #003366; margin-right: 15px; display: inline-block; width: 80px; }

        /* 지도 영역 */
        #map {
            width: 100%;
            height: 450px;
            background: #f8f9fa;
            border-radius: 12px;
            margin: 30px 0;
            border: 1px solid #ddd;
        }

        .contact-footer-en {
            background: #f4f4f4; padding: 25px; border-radius: 4px;
            font-size: 0.95rem; color: #555; line-height: 1.6; border-top: 3px solid #003366; margin-top: 20px;
        }

        .edit-form-box {
            display: none; background: #fff; padding: 30px; border: 2px solid #003366;
            border-radius: 12px; margin-bottom: 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .edit-form-box label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .edit-form-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
        .auth-link { background: none; border: 1px solid #003366; color: #003366; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='contact')}"></header>

<main class="container">
    <h1 class="section-title" style="text-align: left;">Contact</h1>

    <div sec:authorize="isAuthenticated()" style="text-align: right; margin-bottom: 20px;">
        <button onclick="toggleEditForm()" class="auth-link">Modify Info</button>
    </div>

    <div id="contactEditForm" class="edit-form-box">
        <h3 style="margin-bottom:20px; color: #003366;">Edit Contact Details</h3>
        <form th:action="@{/admin/contact/update}" method="post">
            <input type="hidden" name="id" th:value="${contact.id}">
            <label>주소 (국문)</label><input type="text" name="addressKr" th:value="${contact.addressKr}">
            <label>연락처</label><input type="text" name="phone" th:value="${contact.phone}">
            <div style="display:flex; gap:20px;">
                <div style="flex:1;"><label>랩장 성함</label><input type="text" name="labHeadKr" th:value="${contact.labHeadKr}"></div>
                <div style="flex:1;"><label>이메일</label><input type="email" name="email" th:value="${contact.email}"></div>
            </div>
            <label>영문 주소</label><input type="text" name="addressEn" th:value="${contact.addressEn}">
            <div style="display:flex; gap:20px;">
                <div style="flex:1;"><label>위도</label><input type="number" step="any" name="latitude" th:value="${contact.latitude}"></div>
                <div style="flex:1;"><label>경도</label><input type="number" step="any" name="longitude" th:value="${contact.longitude}"></div>
            </div>
            <div style="text-align: right;">
                <button type="button" onclick="toggleEditForm()" style="padding:12px 25px; background:#666; color:#fff; border:none; border-radius:6px; cursor:pointer;">Cancel</button>
                <button type="submit" class="save-btn" style="padding:12px 40px; margin-left:10px;">Save Changes</button>
            </div>
        </form>
    </div>

    <ul class="contact-info-list">
        <li><strong>주 소 :</strong> <span th:text="${contact.addressKr}">서울특별시 ...</span></li>
        <li><strong>연락처 :</strong> <span th:text="${contact.phone}">02-3290-XXXX</span></li>
        <li><strong>랩 장 :</strong> <span th:text="${contact.labHeadKr}">홍길동</span>, <a th:href="'mailto:' + ${contact.email}" th:text="${contact.email}" style="color:#003366;">email</a></li>
    </ul>

    <div id="map" th:data-lat="${contact.latitude}" th:data-lng="${contact.longitude}"></div>

    <div class="contact-footer-en">
        <p> SEAL Lab, <span th:text="${contact.addressEn}">Address...</span><br>TEL <span th:text="${contact.phone}">+82-2-3290-XXXX</span></p>
    </div>
</main>

<script type="text/javascript" th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${@environment.getProperty('kakao.map.api.key')}&autoload=false|"></script>

<script>
    function initMap() {
        // SDK가 로드될 때까지 대기
        if (typeof kakao === 'undefined') {
            console.error("Kakao SDK 로드 실패");
            return;
        }

        kakao.maps.load(function() {
            const mapElement = document.getElementById("map");
            if (!mapElement) return;

            const lat = parseFloat(mapElement.getAttribute("data-lat")) || 37.2757;
            const lng = parseFloat(mapElement.getAttribute("data-lng")) || 127.1325;

            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(lat, lng),
                level: 3
            };

            const map = new kakao.maps.Map(container, options);

            // 마커 표시
            const marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(lat, lng)
            });
            marker.setMap(map);
        });
    }

    // 윈도우 로드 시 실행
    window.onload = initMap;

    // 폼 토글 기능 추가
    function toggleEditForm() {
        const form = document.getElementById('contactEditForm');
        form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'block' : 'none';
    }
</script>
</body>
</html>
