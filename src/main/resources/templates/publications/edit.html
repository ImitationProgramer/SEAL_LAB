<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit Publication - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .edit-box { max-width: 700px; margin: 60px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #003366; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }

        /* 제로트러스트 접근 제한 안내 스타일 (통일성 유지) */
        .denied-container { text-align: center; padding: 100px 20px; }
        .denied-icon { font-size: 5rem; color: #ff4d4d; margin-bottom: 20px; }
        .denied-title { font-size: 2rem; font-weight: 800; color: #333; margin-bottom: 10px; }
        .denied-msg { color: #666; margin-bottom: 30px; line-height: 1.6; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='publications')}"></header>

<main class="container">

    <div sec:authorize="hasRole('ADMIN')" class="edit-box">
        <h2 style="margin-bottom: 30px; border-bottom: 2px solid #003366; padding-bottom: 10px;">Edit Publication</h2>

        <form th:action="@{'/admin/publications/edit/' + ${pub.id}}" method="post">
            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.name()}"
                            th:text="${cat.displayName}"
                            th:selected="${pub.category == cat}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" th:value="${pub.title}" required>
            </div>

            <div class="form-group">
                <label>Authors</label>
                <input type="text" name="authors" th:value="${pub.authors}" required>
            </div>

            <div class="form-group">
                <label>Venue (Journal / Conference / Patent Office)</label>
                <input type="text" name="venue" th:value="${pub.venue}" required>
            </div>

            <div class="form-group">
                <label>Publish Date</label>
                <input type="date" name="publishDate" th:value="${pub.publishDate}" required>
            </div>

            <div class="form-group">
                <label>Link (URL)</label>
                <input type="text" name="link" th:value="${pub.link}">
            </div>

            <div style="text-align: right; margin-top: 30px;">
                <a th:href="@{/publications}" class="cancel-btn" style="text-decoration: none; padding: 12px 25px; display: inline-block;">Cancel</a>
                <button type="submit" class="save-btn" style="padding: 12px 40px; cursor: pointer; font-weight: bold;">Update Changes</button>
            </div>
        </form>
    </div>

    <div sec:authorize="!hasRole('ADMIN')" class="denied-container">
        <div class="denied-icon">🚫</div>
        <h2 class="denied-title">Access Denied</h2>
        <p class="denied-msg">
            학술 실적을 수정할 수 있는 권한이 없습니다. <br>
            관리자 계정으로 로그인하시거나, 보안 신뢰 점수(Trust Score)를 확인해 주세요.
        </p>
        <a th:href="@{/publications}" class="auth-link">Back to List</a>
    </div>

</main>
</body>
</html>
