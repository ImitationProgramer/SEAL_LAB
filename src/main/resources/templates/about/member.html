<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Members - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* 추가 폼 스타일 */
        #addForm {
            display: none;
            text-align: left;
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0 40px 0;
            border: 1px solid #ddd;
        }
        .add-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .add-form-grid input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }
        .full-width { grid-column: span 2; }

        /* 관리자 액션 버튼 컨테이너 (Edit | Delete) */
        .member-admin-actions {
            position: absolute;
            right: 25px;
            top: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .edit-link-text {
            font-size: 0.85rem;
            color: #7ba6c0;
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn-text {
            font-size: 0.85rem;
            color: #ff4d4d;
            background: none;
            border: none;
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .action-divider {
            color: #ddd;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='member')}"></header>

<main class="container">
    <h1 class="section-title" style="text-align: left;">Member</h1>

    <div sec:authorize="hasRole('ADMIN')" class="admin-controls" style="margin-bottom: 30px;">
        <a th:href="@{/admin/users}" class="auth-link" style="cursor:pointer; text-decoration:none;">User 관리로 이동</a>
    </div>

    <div class="member-list">
        <p th:if="${#lists.isEmpty(members)}" style="text-align: center; padding: 80px; color: #999;">
            등록된 연구원이 없습니다.
        </p>

        <div th:each="member : ${members}" class="member-card">
            <div class="member-admin-actions">
                <a sec:authorize="hasRole('ADMIN')" th:href="@{'/admin/users/' + ${member.loginId} + '/edit'}"
                   class="edit-link-text">Edit Profile</a>
                <a sec:authorize="isAuthenticated()" th:if="${#authentication.name == member.loginId}"
                   th:href="@{/profile/me/edit}" class="edit-link-text">Edit Profile</a>
            </div>

            <div class="member-photo">
                <img th:src="${member.imagePath != null ? member.imagePath : '/images/default_user.png'}" alt="Member Photo">
            </div>

            <div class="member-info">
                <h2>
                    <span th:text="${member.name}" style="color: #000; font-weight: 800;">이름</span>
                    <small th:text="'(' + ${member.labRankDisplayName} + ')'" style="font-size: 1rem; color: #666; font-weight: normal;"></small>
                </h2>
                <p th:text="${member.labRankDisplayName}" style="font-weight: 600; color: #444;">연구실 직급</p>
                <p th:text="${member.department != null and !member.department.isBlank() ? member.department : 'Department 정보 없음'}">Department</p>
                <p>Kangnam University</p>
                <p><a th:href="'mailto:' + ${member.email}" th:text="${member.email}" class="email-link">Email</a></p>

                <div class="keywords" th:if="${member.keywords != null and !member.keywords.isEmpty()}">
                    <strong>Keywords:</strong><br>
                    <span th:text="${member.keywords}">Keywords here...</span>
                </div>

                <div class="keywords" th:if="${member.bio != null and !member.bio.isEmpty()}" style="margin-top: 14px;">
                    <strong>Bio:</strong><br>
                    <span th:text="${member.bio}">소개 문구</span>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
