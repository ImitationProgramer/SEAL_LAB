<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Members - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* 추가 폼 스타일 */
        #addForm {
            display: none;
            text-align: left;
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0 40px 0;
            border: 1px solid #ddd;
        }
        .add-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .add-form-grid input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }
        .full-width { grid-column: span 2; }

        /* 관리자 액션 버튼 컨테이너 (Edit | Delete) */
        .member-admin-actions {
            position: absolute;
            right: 25px;
            top: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .edit-link-text {
            font-size: 0.85rem;
            color: #7ba6c0;
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn-text {
            font-size: 0.85rem;
            color: #ff4d4d;
            background: none;
            border: none;
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .action-divider {
            color: #ddd;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='member')}"></header>

<main class="container">
    <h1 class="section-title" style="text-align: left;">Member</h1>

    <div sec:authorize="isAuthenticated()" class="admin-controls" style="margin-bottom: 30px;">
        <button onclick="toggleAddForm()" class="auth-link" style="cursor:pointer;">+ Add New Member</button>

        <div id="addForm">
            <h3 style="margin-bottom: 20px; color: #003366;">Register New Member</h3>
            <form th:action="@{/admin/member/add}" method="post" enctype="multipart/form-data">
                <div class="add-form-grid">
                    <input type="text" name="name" placeholder="이름 (Ex: 이여민)" required>
                    <input type="text" name="degree" placeholder="학위 (Ex: 석사생)">
                    <input type="text" name="role" placeholder="역할 (Ex: Graduate Student)">
                    <input type="text" name="department" placeholder="학과 (Ex: Computer Science)">
                    <input type="email" name="email" placeholder="이메일 주소" class="full-width">
                    <input type="text" name="keywords" placeholder="관심 분야 (쉼표 구분)" class="full-width">
                    <div class="full-width">
                        <label style="display:block; margin-bottom: 5px; font-size: 0.9rem;">프로필 사진:</label>
                        <input type="file" name="file">
                    </div>
                </div>
                <div style="text-align: right; margin-top: 20px;">
                    <button type="button" onclick="toggleAddForm()" class="cancel-btn" style="padding: 10px 20px; cursor:pointer;">Cancel</button>
                    <button type="submit" class="save-btn" style="padding: 10px 30px; cursor:pointer;">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <div class="member-list">
        <p th:if="${#lists.isEmpty(members)}" style="text-align: center; padding: 80px; color: #999;">
            등록된 연구원이 없습니다.
        </p>

        <div th:each="member : ${members}" class="member-card">

            <div sec:authorize="isAuthenticated()" class="member-admin-actions">
                <a th:href="@{'/admin/member/edit/' + ${member.id}}" class="edit-link-text">Edit</a>
                <span class="action-divider">|</span>
                <form th:action="@{'/admin/member/delete/' + ${member.id}}" method="post" style="display:inline;">
                    <button type="submit" class="delete-btn-text" onclick="return confirm('정말 삭제하시겠습니까?')">Delete</button>
                </form>
            </div>

            <div class="member-photo">
                <img th:src="${member.imagePath != null ? member.imagePath : '/images/default_user.png'}" alt="Member Photo">
            </div>

            <div class="member-info">
                <h2>
                    <span th:text="${member.name}" style="color: #000; font-weight: 800;">이름</span>
                    <small th:text="'(' + ${member.degree} + ')'" style="font-size: 1rem; color: #666; font-weight: normal;"></small>
                </h2>
                <p th:text="${member.role}" style="font-weight: 600; color: #444;">Role</p>
                <p th:text="${member.department}">Department</p>
                <p>Kangnam University</p>
                <p><a th:href="'mailto:' + ${member.email}" th:text="${member.email}" class="email-link">Email</a></p>

                <div class="keywords" th:if="${member.keywords != null and !member.keywords.isEmpty()}">
                    <strong>Keywords:</strong><br>
                    <span th:text="${member.keywords}">Keywords here...</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    function toggleAddForm() {
        const form = document.getElementById('addForm');
        form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'block' : 'none';
    }
</script>
</body>
</html>
