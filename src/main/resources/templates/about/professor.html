<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Professor - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        /* 상단 레이아웃: 사진과 기본정보만 배치 */
        .prof-top-layout { display: flex; gap: 60px; margin-top: 40px; align-items: flex-start; margin-bottom: 40px; }
        .prof-photo { flex: 0 0 320px; }
        .prof-photo img { width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .prof-basic-info { flex: 1; position: relative; }

        /* 공통 섹션 스타일 */
        .prof-section { margin-bottom: 50px; position: relative; width: 100%; }
        .prof-section h3 {
            font-size: 1.6rem; color: #003366; border-bottom: 2px solid #003366;
            padding-bottom: 12px; margin-bottom: 25px; font-weight: 800;
        }

        .edit-btn {
            position: absolute; right: 0; top: 5px; font-size: 0.85rem;
            color: #7ba6c0; cursor: pointer; font-weight: 600; text-decoration: underline;
        }
        .content-view { line-height: 1.8; color: #333; font-size: 1.05rem; }
        .content-view h2 { margin-top: 0; color: #000; font-size: 2.2rem; margin-bottom: 15px; }

        /* 에디터 박스 스타일 */
        .editor-box { display: none; margin-top: 15px; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .save-btn {
            background: #003366; color: white; border: none; padding: 8px 20px;
            border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: bold;
        }
        .cancel-btn {
            background: #eee; color: #666; border: none; padding: 8px 20px;
            border-radius: 4px; cursor: pointer; margin-top: 15px; margin-right: 8px;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='professor')}"></header>

<main class="container">
    <h1 class="section-title" style="text-align: left; margin-bottom: 10px; color: #000;">Professor</h1>

    <div class="prof-top-layout">
        <div class="prof-photo">
            <img th:src="@{/images/prof_park.png}" alt="Prof. Jungsoo Park">
        </div>

        <div class="prof-basic-info">
            <div class="prof-section">
                <span sec:authorize="hasRole('ADMIN')" class="edit-btn" onclick="startEdit('basic')">[Edit Info]</span>
                <div id="basic-view" class="content-view" th:utext="${prof.basicInfo}">
                    <h2>Prof. Jungsoo Park</h2>
                    <p>Assistant Professor, School of Software Application, Kangnam University</p>
                </div>
                <div id="basic-edit" class="editor-box" sec:authorize="hasRole('ADMIN')">
                    <div id="basic-quill" style="height: 150px;"></div>
                    <div style="text-align: right;">
                        <button class="cancel-btn" onclick="cancelEdit('basic')">Cancel</button>
                        <button class="save-btn" onclick="save('basic')">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="prof-section">
        <h3>Research Interests</h3>
        <span sec:authorize="hasRole('ADMIN')" class="edit-btn" onclick="startEdit('research')">[Edit]</span>
        <div id="research-view" class="content-view" th:utext="${prof.researchInterests}">
            <ul><li>Android Malware Analysis</li></ul>
        </div>
        <div id="research-edit" class="editor-box" sec:authorize="hasRole('ADMIN')">
            <div id="research-quill" style="height: 250px;"></div>
            <div style="text-align: right;">
                <button class="cancel-btn" onclick="cancelEdit('research')">Cancel</button>
                <button class="save-btn" onclick="save('research')">Save Changes</button>
            </div>
        </div>
    </div>

    <div class="prof-section">
        <h3>Education</h3>
        <span sec:authorize="hasRole('ADMIN')" class="edit-btn" onclick="startEdit('edu')">[Edit]</span>
        <div id="edu-view" class="content-view" th:utext="${prof.education}">
            <p><strong>Ph.D. in Software Convergence</strong>, Soongsil University</p>
        </div>
        <div id="edu-edit" class="editor-box" sec:authorize="hasRole('ADMIN')">
            <div id="edu-quill" style="height: 300px;"></div>
            <div style="text-align: right;">
                <button class="cancel-btn" onclick="cancelEdit('edu')">Cancel</button>
                <button class="save-btn" onclick="save('edu')">Save Changes</button>
            </div>
        </div>
    </div>

    <div class="prof-section">
        <h3>Honors and Awards</h3>
        <span sec:authorize="hasRole('ADMIN')" class="edit-btn" onclick="startEdit('awards')">[Edit]</span>
        <div id="awards-view" class="content-view" th:utext="${prof.awards}">
            <ul><li>2025 국가정보원장 표창 수상</li></ul>
        </div>
        <div id="awards-edit" class="editor-box" sec:authorize="hasRole('ADMIN')">
            <div id="awards-quill" style="height: 300px;"></div>
            <div style="text-align: right;">
                <button class="cancel-btn" onclick="cancelEdit('awards')">Cancel</button>
                <button class="save-btn" onclick="save('awards')">Save Changes</button>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script th:inline="javascript">
    /* <![CDATA[ */
    let quills = {};

    function startEdit(type) {
        const editArea = document.getElementById(type + '-edit');
        if (!editArea) return; // 관리자 권한이 없으면 실행 안 됨

        document.getElementById(type + '-view').style.display = 'none';
        editArea.style.display = 'block';

        if (!quills[type]) {
            quills[type] = new Quill('#' + type + '-quill', {
                modules: {
                    toolbar: [
                        [ { 'header': [1, 2, 3, false] } ],
                        [ 'bold', 'italic', 'underline' ],
                        [ { 'list': 'ordered'}, { 'list': 'bullet' } ],
                        [ 'clean' ]
                    ]
                },
                theme: 'snow'
            });
        }
        quills[type].root.innerHTML = document.getElementById(type + '-view').innerHTML;
    }

    function cancelEdit(type) {
        document.getElementById(type + '-view').style.display = 'block';
        document.getElementById(type + '-edit').style.display = 'none';
    }

    function save(type) {
        const content = quills[type].root.innerHTML;
        const csrfToken = /*[[${_csrf?.token}]]*/ '';
        const csrfHeader = /*[[${_csrf?.headerName}]]*/ 'X-CSRF-TOKEN';

        fetch('/admin/professor/edit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: 'field=' + type + '&content=' + encodeURIComponent(content)
        }).then(res => {
            if(res.ok) {
                document.getElementById(type + '-view').innerHTML = content;
                cancelEdit(type);
                alert('수정되었습니다.');
            } else {
                alert('저장 실패. 권한을 확인하세요.');
            }
        });
    }
    /* ]]> */
</script>
</body>
</html>
