<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="headerFragment(activeMenu)">
    <div class="logo">
        <a th:href="@{/}">
            <img th:src="@{/images/seal_logo.png}" alt="SEAL Lab Logo">
        </a>
    </div>

    <div class="right-area">
        <nav>
            <ul class="nav-menu">
                <li class="nav-item dropdown">
                    <a href="javascript:void(0)" class="dropbtn"
                       th:classappend="${activeMenu == 'professor' or activeMenu == 'member'} ? 'active'">
                        About Us <span class="arrow-icon"></span>
                    </a>
                    <div class="dropdown-content">
                        <a th:href="@{/about/professor}" th:classappend="${activeMenu == 'professor'} ? 'sub-active'">Professor</a>
                        <a th:href="@{/about/member}" th:classappend="${activeMenu == 'member'} ? 'sub-active'">Member</a>
                    </div>
                </li>

                <li><a th:href="@{/publications}" th:classappend="${activeMenu == 'publications'} ? 'active'">Publication</a></li>
                <li><a th:href="@{/projects}" th:classappend="${activeMenu == 'projects'} ? 'active'">Project</a></li>
                <li><a th:href="@{/gallery}" th:classappend="${activeMenu == 'gallery'} ? 'active'">Gallery</a></li>
                <li><a th:href="@{/contact}" th:classappend="${activeMenu == 'contact'} ? 'active'">Contact</a></li>
                <li><a th:href="@{/related-site}" th:classappend="${activeMenu == 'related'} ? 'active'">Related Site</a></li>
            </ul>
        </nav>

        <div class="auth-box">
            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="auth-link">Login</a>

            <div sec:authorize="isAuthenticated()" class="user-status">
                <span class="user-name">
                    <span sec:authentication="name">Admin</span>님
                </span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>

    <style>
        /* --- 드롭다운 및 화살표 애니메이션 --- */
        .nav-item.dropdown {
            position: relative;
            display: inline-block;
        }

        /* 화살표 아이콘 (CSS 삼각형) */
        .arrow-icon {
            display: inline-block;
            width: 0;
            height: 0;
            margin-left: 6px;
            vertical-align: middle;
            border-top: 5px solid currentColor; /* 부모 글자색을 따라감 */
            border-right: 5px solid transparent;
            border-left: 5px solid transparent;
            transition: transform 0.3s ease; /* 회전 애니메이션 속도 */
        }

        /* 마우스 호버 시 화살표 회전 (180도) */
        .nav-item.dropdown:hover .arrow-icon {
            transform: rotate(180deg);
        }

        /* 드롭다운 메뉴 스타일 */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 140px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
            z-index: 100;
            border-radius: 4px;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
            color: #003366;
        }

        /* 호버 시 드롭다운 표시 */
        .nav-item.dropdown:hover .dropdown-content {
            display: block;
        }

        /* 서브 메뉴 활성화 스타일 */
        .sub-active {
            font-weight: bold;
            color: #003366 !important;
            background-color: #f8f9fa;
        }

        /* 로그아웃 버튼 스타일 */
        .logout-btn {
            background: none;
            border: 1px solid #ccc;
            color: #666;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #666;
            color: #fff;
        }
    </style>
</header>
</html>
