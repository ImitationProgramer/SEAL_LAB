<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="headerFragment(activeMenu)">
    <div class="logo">
        <a th:href="@{/}">
            <img th:src="@{/images/seal_logo.png}" alt="SEAL Lab Logo">
        </a>
    </div>

    <div class="right-area">
        <nav>
            <ul class="nav-menu">
                <li class="nav-item dropdown">
                    <a href="javascript:void(0)" class="dropbtn"
                       th:classappend="${activeMenu == 'professor' or activeMenu == 'member'} ? 'active'">
                        About Us <span class="arrow-icon"></span>
                    </a>
                    <div class="dropdown-content">
                        <a th:href="@{/about/professor}" th:classappend="${activeMenu == 'professor'} ? 'sub-active'">Professor</a>
                        <a th:href="@{/about/member}" th:classappend="${activeMenu == 'member'} ? 'sub-active'">Member</a>
                    </div>
                </li>

                <li><a th:href="@{/publications}" th:classappend="${activeMenu == 'publications'} ? 'active'">Publication</a></li>
                <li><a th:href="@{/projects}" th:classappend="${activeMenu == 'projects'} ? 'active'">Project</a></li>
                <li><a th:href="@{/gallery}" th:classappend="${activeMenu == 'gallery'} ? 'active'">Gallery</a></li>
                <li><a th:href="@{/contact}" th:classappend="${activeMenu == 'contact'} ? 'active'">Contact</a></li>
                <li><a th:href="@{/related-site}" th:classappend="${activeMenu == 'related'} ? 'active'">Related Site</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/trust/debug}" th:classappend="${activeMenu == 'trust'} ? 'active'">Trust Debug</a></li>
            </ul>
        </nav>

        <div class="auth-box">
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/signup}" class="auth-link signup-btn">Sign Up</a>
                <a th:href="@{/login}" class="auth-link">Login</a>
            </th:block>

            <div sec:authorize="isAuthenticated()" class="user-status">
                <span class="user-name">
                    <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="role-badge admin">ADMIN</span>
                    <span th:if="${#authorization.expression('hasRole(''MEMBER'')')}" class="role-badge member">MEMBER</span>
                    <span sec:authentication="name">User</span>님
                </span>
                <a sec:authorize="hasRole('MEMBER')" th:href="@{/member/security/password}"
                   style="margin-left:10px; color:#003366; text-decoration:none; font-size:0.85rem; font-weight:700;">
                    Change Password
                </a>
                <a sec:authorize="isAuthenticated()" th:href="@{/profile/me/edit}"
                   style="margin-left:10px; color:#003366; text-decoration:none; font-size:0.85rem; font-weight:700;">
                    Edit Profile
                </a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>

    <style>
        /* --- 기존 스타일 유지 및 추가 --- */
        .nav-item.dropdown { position: relative; display: inline-block; }
        .arrow-icon {
            display: inline-block; width: 0; height: 0; margin-left: 6px;
            vertical-align: middle; border-top: 5px solid currentColor;
            border-right: 5px solid transparent; border-left: 5px solid transparent;
            transition: transform 0.3s ease;
        }
        .nav-item.dropdown:hover .arrow-icon { transform: rotate(180deg); }

        .dropdown-content {
            display: none; position: absolute; background-color: #ffffff;
            min-width: 140px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
            z-index: 100; border-radius: 4px; top: 100%; left: 50%;
            transform: translateX(-50%); overflow: hidden;
        }
        .dropdown-content a {
            color: #333; padding: 12px 16px; text-decoration: none;
            display: block; font-size: 0.9rem; transition: background 0.2s;
        }
        .dropdown-content a:hover { background-color: #f1f1f1; color: #003366; }
        .nav-item.dropdown:hover .dropdown-content { display: block; }
        .sub-active { font-weight: bold; color: #003366 !important; background-color: #f8f9fa; }

        /* --- 신규 추가: 버튼 및 배지 스타일 --- */
        .signup-btn {
            border-color: #7ba6c0 !important;
            color: #7ba6c0 !important;
            margin-right: 8px;
        }
        .signup-btn:hover {
            background-color: #7ba6c0 !important;
            color: #fff !important;
        }

        .role-badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-weight: 800;
            vertical-align: middle;
        }
        .role-badge.admin { background-color: #ff4d4d; color: #fff; }
        .role-badge.member { background-color: #7ba6c0; color: #fff; }

        .logout-btn {
            background: none; border: 1px solid #ccc; color: #666;
            padding: 4px 10px; border-radius: 4px; font-size: 0.8rem;
            cursor: pointer; margin-left: 10px; transition: all 0.2s;
        }
        .logout-btn:hover { background: #666; color: #fff; }
    </style>
</header>
</html>
