<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gallery - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* --- 기존 그리드 스타일 --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
            cursor: pointer; /* 클릭 가능하다는 표시 */
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img { transform: scale(1.05); }

        /* --- 모달(원본 보기) 스타일 --- */
        .modal {
            display: none; /* 기본은 숨김 */
            position: fixed;
            z-index: 2000; /* 헤더보다 위에 표시 */
            padding-top: 50px;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* 어두운 배경 */
            cursor: zoom-out; /* 클릭하면 나가는 표시 */
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh; /* 화면 높이의 85%까지 */
            border-radius: 5px;
            animation: zoom 0.3s; /* 나타날 때 애니메이션 */
        }
        @keyframes zoom {
            from {transform: scale(0.7)} to {transform: scale(1)}
        }
        #modal-caption {
            margin: auto;
            display: block;
            width: 80%;
            text-align: center;
            color: #ccc;
            padding: 15px 0;
        }
        .close-modal {
            position: absolute;
            top: 20px; right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 삭제 버튼은 모달과 별개로 작동해야 함 */
        .gallery-delete-btn {
            position: absolute; top: 8px; right: 8px;
            background: rgba(255, 77, 77, 0.9);
            color: white; border: none; padding: 4px 10px;
            border-radius: 4px; font-size: 0.75rem;
            z-index: 10; cursor: pointer; display: none;
        }
        .gallery-item:hover .gallery-delete-btn { display: block; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='gallery')}"></header>

<main class="container">
    <h1 class="section-title" style="text-align: left;">Gallery</h1>

    <div sec:authorize="isAuthenticated()" class="upload-box" style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px dashed #ccc;">
        <h3 style="margin-bottom: 15px; color: #003366;">+ Upload New Photo</h3>
        <form th:action="@{/admin/gallery/add}" method="post" enctype="multipart/form-data" style="display: flex; gap: 10px;">
            <input type="text" name="title" placeholder="Description" required style="flex: 2; padding: 10px;">
            <input type="file" name="file" required style="flex: 1;">
            <button type="submit" class="save-btn" style="padding: 10px 25px;">Upload</button>
        </form>
    </div>

    <div class="gallery-grid">
        <div th:each="image : ${images}" class="gallery-item">
            <form sec:authorize="isAuthenticated()" th:action="@{'/admin/gallery/delete/' + ${image.id}}" method="post">
                <button type="submit" class="gallery-delete-btn"
                        onclick="event.stopPropagation(); return confirm('정말 삭제할까요?')">Delete</button>
            </form>

            <img th:src="${image.imagePath}"
                 th:alt="${image.title}"
                 th:data-path="${image.imagePath}"
                 th:data-title="${image.title}"
                 onclick="openModal(this.getAttribute('data-path'), this.getAttribute('data-title'))">
        </div>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img">
        <div id="modal-caption"></div>
    </div>

    <p th:if="${#lists.isEmpty(images)}" style="text-align: center; color: #999; margin-top: 50px;">
        No photos yet.
    </p>
</main>

<script th:inline="javascript">
    // 모달 열기
    function openModal(src, title) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modal-img");
        const captionText = document.getElementById("modal-caption");

        modal.style.display = "block";
        modalImg.src = src;
        captionText.innerHTML = title;

        // 스크롤 방지 (선택 사항)
        document.body.style.overflow = "hidden";
    }

    // 모달 닫기
    function closeModal() {
        document.getElementById("imageModal").style.display = "none";
        document.body.style.overflow = "auto";
    }

    // ESC 키로 닫기
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    });
</script>
</body>
</html>
