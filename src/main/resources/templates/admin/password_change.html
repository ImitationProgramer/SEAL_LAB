<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Password Change - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .password-wrapper {
            max-width: 620px;
            margin: 48px auto 80px;
            padding: 0 20px;
        }
        .password-card {
            background: #fff;
            padding: 34px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eef2f6;
        }
        h1 { margin: 0 0 12px; color: #003366; }
        p { color: #5a6472; line-height: 1.6; }
        .error-box {
            margin: 18px 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff5f5;
            color: #b3261e;
            border: 1px solid #ffd6d6;
        }
        .warn-box {
            margin: 18px 0;
            padding: 14px 16px;
            border-radius: 10px;
            background: #fff8e8;
            border: 1px solid #f6d48b;
            color: #7c5a13;
        }
        .input-group { margin-top: 18px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #203040;
        }
        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccd5df;
            font-size: 15px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #003366;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .submit-btn:hover { background: #002244; }
        .hint { margin-top: 12px; font-size: 0.9rem; color: #6d7888; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='trust')}"></header>

<main class="password-wrapper">
    <section class="password-card">
        <h1>관리자 비밀번호 변경</h1>
        <p><strong th:text="${loginId}">admin</strong> 계정의 현재 비밀번호를 검증한 뒤 새 비밀번호로 교체합니다.</p>

        <div th:if="${passwordError}" class="error-box" th:text="${passwordError}">
            비밀번호 변경에 실패했습니다.
        </div>

        <div class="warn-box">
            변경이 완료되면 현재 세션을 포함한 기존 로그인 세션은 더 이상 유효하지 않습니다. 다시 로그인해야 하며, 관리자 계정은 이후 MFA를 다시 통과해야 합니다.
        </div>

        <form th:action="@{/admin/security/password}" method="post">
            <div class="input-group">
                <label for="currentPassword">현재 비밀번호</label>
                <input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="input-group">
                <label for="newPassword">새 비밀번호</label>
                <input id="newPassword" type="password" name="newPassword" autocomplete="new-password" required>
            </div>
            <div class="input-group">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" required>
            </div>
            <button type="submit" class="submit-btn">비밀번호 변경 후 다시 로그인</button>
        </form>

        <p class="hint">비밀번호는 영문, 숫자, 특수문자를 포함한 8자 이상이어야 합니다.</p>
    </section>
</main>
</body>
</html>
