<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Password Reset Token - SEAL LAB</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; }
        .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px 16px; box-sizing: border-box; }
        .card { width: 100%; max-width: 620px; background: white; border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); padding: 32px; }
        h1 { margin: 0 0 10px; font-size: 28px; color: #0f2e4f; }
        p { color: #5a6472; line-height: 1.6; }
        .warning { margin: 20px 0; padding: 16px; border-radius: 10px; background: #eef4fb; border: 1px solid #d3e1f2; color: #1f4060; }
        .token-box { margin: 24px 0; padding: 18px; border-radius: 12px; background: #f8fafc; border: 1px solid #dde7f0; font-family: monospace; font-size: 1.4rem; color: #003366; text-align: center; word-break: break-all; }
        .link-box { margin-top: 18px; padding: 14px; border-radius: 10px; background: #eef4fb; color: #003366; word-break: break-all; }
        a { color: #003366; font-weight: 700; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>회원 reset token 발급 완료</h1>
        <p><strong th:text="${loginId}">member</strong> 계정의 1회용 reset token입니다.</p>

        <div class="warning">
            이 token은 한 번만 사용 가능하며 <strong th:text="${#temporals.format(expiresAt, 'yyyy-MM-dd HH:mm')}">2026-05-19 19:30</strong>까지 유효합니다. 이 화면을 닫은 뒤에는 다시 평문으로 보여주지 않습니다.
        </div>

        <div class="token-box" th:text="${issuedToken}">ABCD2345EFGH6789JKLM2345</div>

        <div class="link-box">
            <a th:href="@{/password/reset/member(token=${issuedToken})}">비밀번호 재설정 페이지로 이동</a>
        </div>
    </div>
</div>
</body>
</html>
