<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Backup Code Recovery - SEAL LAB</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; }
        .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px 16px; box-sizing: border-box; }
        .card { width: 100%; max-width: 520px; background: white; border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); padding: 32px; }
        h1 { margin: 0 0 10px; font-size: 28px; color: #0f2e4f; }
        p { color: #5a6472; line-height: 1.6; }
        .notice { margin: 22px 0; padding: 16px; border-radius: 10px; background: #fff8e8; border: 1px solid #f6d48b; }
        .error { margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .input-group { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #203040; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #ccd5df; font-size: 15px; text-transform: uppercase; }
        button { margin-top: 20px; width: 100%; border: none; border-radius: 8px; padding: 14px; background: #003366; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #002244; }
        .link { display: inline-block; margin-top: 16px; color: #003366; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1 th:text="${mode == 'STEP_UP' ? 'Backup Code Step-up' : 'Backup Code Recovery'}">Backup Code Recovery</h1>
        <p><strong th:text="${loginId}">admin</strong> 계정의 백업 코드를 입력하세요.</p>

        <div th:if="${mfaError}" class="error" th:text="${mfaError}">오류</div>

        <div class="notice">
            <p th:if="${mode == 'STEP_UP'}" style="margin:0;">현재 작업은 <strong th:text="${requiredScore} + '점'">90점</strong> 이상을 요구합니다. 백업 코드 1개를 사용하면 현재 세션에 한해 step-up 인증을 완료합니다.</p>
            <p th:if="${mode != 'STEP_UP'}" style="margin:0;">인증 앱을 사용할 수 없을 때 미리 저장한 1회용 backup code로 관리자 로그인 인증을 완료할 수 있습니다.</p>
        </div>

        <form th:action="@{/mfa/recovery}" method="post">
            <div class="input-group">
                <label for="backupCode">Backup Code</label>
                <input id="backupCode" name="backupCode" autocomplete="one-time-code" placeholder="ABCD-EFGH" maxlength="9" required>
            </div>
            <button type="submit">Backup Code로 계속하기</button>
        </form>

        <a class="link" th:href="@{/mfa/verify}">TOTP 코드 입력으로 돌아가기</a>
    </div>
</div>
</body>
</html>
