<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset - SEAL LAB</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; }
        .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px 16px; box-sizing: border-box; }
        .card { width: 100%; max-width: 560px; background: white; border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); padding: 32px; }
        h1 { margin: 0 0 10px; font-size: 28px; color: #0f2e4f; }
        p { color: #5a6472; line-height: 1.6; }
        .error-box { margin: 18px 0; padding: 12px 14px; border-radius: 10px; background: #fff5f5; color: #b3261e; border: 1px solid #ffd6d6; }
        .info-box { margin: 18px 0; padding: 14px 16px; border-radius: 10px; background: #eef4fb; border: 1px solid #d3e1f2; color: #1f4060; }
        .input-group { margin-top: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #203040; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #ccd5df; font-size: 15px; }
        button { margin-top: 22px; width: 100%; border: none; border-radius: 8px; padding: 14px; background: #003366; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #002244; }
        .hint { margin-top: 10px; font-size: 0.9rem; color: #6d7888; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>관리자 비밀번호 재설정</h1>

        <div th:if="${resetError}" class="error-box" th:text="${resetError}">
            reset token 또는 backup code를 확인해주세요.
        </div>

        <div th:if="${tokenValid}">
            <p><strong th:text="${loginId}">admin</strong> 계정의 비밀번호를 새로 설정합니다.</p>
            <div class="info-box">
                reset token 유효 시간:
                <strong th:text="${#temporals.format(expiresAt, 'yyyy-MM-dd HH:mm')}">2026-05-19 19:30</strong><br>
                이 단계에서는 <strong>backup code 1개</strong>를 추가로 입력해야 합니다.
            </div>

            <form th:action="@{/password/reset}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="input-group">
                    <label for="backupCode">backup code</label>
                    <input id="backupCode" name="backupCode" placeholder="ABCD-EFGH" required>
                </div>
                <div class="input-group">
                    <label for="newPassword">새 비밀번호</label>
                    <input id="newPassword" type="password" name="newPassword" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <input id="confirmPassword" type="password" name="confirmPassword" required>
                </div>
                <button type="submit">비밀번호 재설정</button>
            </form>

            <p class="hint">성공하면 기존 세션은 모두 만료되며 다시 로그인해야 합니다.</p>
        </div>

        <div th:if="${tokenValid == false}" class="error-box">
            reset token이 유효하지 않거나 만료되었습니다. 다시 발급받아 주세요.
        </div>
    </div>
</div>
</body>
</html>
