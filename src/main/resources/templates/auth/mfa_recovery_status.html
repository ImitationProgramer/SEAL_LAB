<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Backup Code Status - SEAL LAB</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; }
        .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px 16px; box-sizing: border-box; }
        .card { width: 100%; max-width: 620px; background: white; border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); padding: 32px; }
        h1 { margin: 0 0 10px; font-size: 28px; color: #0f2e4f; }
        p { color: #5a6472; line-height: 1.6; }
        .count-box {
            margin: 22px 0;
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #dde7f0;
            text-align: center;
        }
        .count-value { font-size: 3.2rem; line-height: 1; font-weight: 800; color: #003366; }
        .count-label { margin-top: 8px; font-size: 0.95rem; color: #6b7585; }
        .banner {
            margin: 16px 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: #effaf2;
            color: #17633f;
            border: 1px solid #cfead7;
        }
        .warning {
            margin: 16px 0;
            padding: 14px 16px;
            border-radius: 10px;
            background: #fff8e8;
            border: 1px solid #f6d48b;
            color: #7c5a13;
        }
        .danger {
            margin: 16px 0;
            padding: 14px 16px;
            border-radius: 10px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
        }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
        .actions form, .actions a { flex: 1; min-width: 220px; }
        button, .secondary-link {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        button { background: #003366; color: white; }
        button:hover { background: #002244; }
        .secondary-link {
            background: #eef4fb;
            color: #003366;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>관리자 Backup Code 상태</h1>
        <p><strong th:text="${loginId}">admin</strong> 계정의 남은 1회용 backup code 개수를 확인하고, 필요하면 새 세트를 재발급할 수 있습니다.</p>

        <div th:if="${operationMessage}" class="banner" th:text="${operationMessage}">backup code를 재발급했습니다.</div>
        <div th:if="${mfaError}" class="danger" th:text="${mfaError}">작업에 실패했습니다.</div>

        <div class="count-box">
            <div class="count-value" th:text="${remainingCodes}">8</div>
            <div class="count-label">남은 backup code</div>
        </div>

        <div class="warning" th:if="${!backupCodeExhausted}">
            재발급을 누르면 현재 남아 있는 미사용 backup code도 모두 폐기되고, 새 코드 세트가 한 번만 다시 표시됩니다.
        </div>
        <div class="danger" th:if="${backupCodeExhausted}">
            사용할 수 있는 backup code가 남아 있지 않습니다. 재발급 후 새 코드를 안전한 곳에 별도로 저장해두세요.
        </div>

        <div class="actions">
            <form th:action="@{/mfa/recovery/reissue}" method="post">
                <button type="submit" th:text="${backupCodeExhausted} ? 'backup code 새로 발급하기' : 'backup code 재발급하기'">backup code 재발급하기</button>
            </form>
            <a class="secondary-link" th:href="@{/trust/debug}">Trust Debug로 돌아가기</a>
        </div>
    </div>
</div>
</body>
</html>
