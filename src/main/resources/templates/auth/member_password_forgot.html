<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Password Reset Request - SEAL LAB</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .forgot-wrapper { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding: 32px 16px; box-sizing: border-box; background: #f9f9f9; }
        .forgot-card { width: 100%; max-width: 460px; background: #fff; padding: 36px; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        h2 { margin: 0 0 18px; text-align: center; color: #003366; }
        p { color: #5a6472; line-height: 1.6; }
        .error-box { margin: 18px 0; padding: 12px 14px; border-radius: 10px; background: #fff5f5; color: #b3261e; border: 1px solid #ffd6d6; }
        .warn-box { margin: 18px 0; padding: 14px 16px; border-radius: 10px; background: #eef4fb; border: 1px solid #d3e1f2; color: #1f4060; }
        .input-group { margin-top: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 8px; background: #003366; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #002244; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment(activeMenu='login')}"></header>

<div class="forgot-wrapper">
    <div class="forgot-card">
        <h2>회원 비밀번호 재설정 요청</h2>
        <p>가입 시 사용한 <strong>loginId</strong>와 <strong>email</strong>을 입력하면 1회용 reset token을 발급합니다.</p>

        <div th:if="${resetError}" class="error-box" th:text="${resetError}">reset 요청에 실패했습니다.</div>

        <div class="warn-box">
            현재 프로젝트는 메일 발송 인프라 대신 발급된 token을 한 번만 화면에 보여주는 방식입니다.
        </div>

        <form th:action="@{/password/forgot/member}" method="post">
            <div class="input-group">
                <label for="loginId">회원 loginId</label>
                <input id="loginId" type="text" name="loginId" th:value="${loginId}" required>
            </div>
            <div class="input-group">
                <label for="email">등록 email</label>
                <input id="email" type="email" name="email" th:value="${email}" required>
            </div>
            <button type="submit">reset token 발급</button>
        </form>
    </div>
</div>
</body>
</html>
