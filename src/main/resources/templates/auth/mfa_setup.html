<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MFA Setup - SEAL LAB</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; }
        .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px 16px; box-sizing: border-box; }
        .card { width: 100%; max-width: 560px; background: white; border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); padding: 32px; }
        h1 { margin: 0 0 10px; font-size: 28px; color: #0f2e4f; }
        p { color: #5a6472; line-height: 1.6; }
        .meta { margin: 20px 0; padding: 16px; border-radius: 10px; background: #f8fafc; border: 1px solid #dde7f0; }
        .qr-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 24px 0; padding: 20px; border-radius: 12px; background: linear-gradient(180deg, #f8fafc 0%, #eef4fb 100%); border: 1px solid #dde7f0; }
        .qr-panel img { width: 280px; max-width: 100%; border-radius: 12px; border: 1px solid #ccd5df; background: white; padding: 12px; box-sizing: border-box; }
        .qr-panel strong { color: #0f2e4f; }
        .secret { font-family: monospace; font-size: 16px; color: #003366; word-break: break-all; }
        .error { margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .input-group { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #203040; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #ccd5df; font-size: 15px; }
        button { margin-top: 20px; width: 100%; border: none; border-radius: 8px; padding: 14px; background: #003366; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #002244; }
        .hint { font-size: 13px; color: #7b8794; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>관리자 MFA 설정</h1>
        <p><strong th:text="${loginId}">admin</strong> 계정은 관리자 보호 작업 전에 TOTP 기반 MFA가 필요합니다.</p>

        <div th:if="${mfaError}" class="error" th:text="${mfaError}">MFA 오류</div>

        <div class="qr-panel">
            <strong>인증 앱으로 QR 코드를 스캔하세요</strong>
            <img th:src="@{/mfa/setup/qr}" alt="MFA QR Code">
            <p class="hint" style="margin: 0;">스캔이 어려우면 아래 secret을 수동으로 등록해도 됩니다.</p>
        </div>

        <div class="meta">
            <p>1. Google Authenticator, Microsoft Authenticator, 1Password 같은 앱을 엽니다.</p>
            <p>2. 위 QR 코드를 스캔하거나 아래 secret을 수동 등록합니다.</p>
            <p class="secret" th:text="${secret}">SECRET</p>
            <p class="hint" th:text="${otpAuthUri}">otpauth://totp/...</p>
        </div>

        <form th:action="@{/mfa/setup}" method="post">
            <div class="input-group">
                <label for="code">6자리 MFA 코드</label>
                <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6" required>
            </div>
            <button type="submit">MFA 등록 완료</button>
        </form>
    </div>
</div>
</body>
</html>
